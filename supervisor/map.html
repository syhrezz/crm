  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --primary: #3B5BDB; --primary-light: #EEF2FF; --primary-dark: #2F4AC7;
      --sidebar-bg: #0F172A; --sidebar-text: #94A3B8;
      --success: #0E9F6E; --warning: #E3A008; --danger: #F05252;
      --surface: #F8FAFC; --card: #FFFFFF; --border: #E2E8F0;
      --text-primary: #0F172A; --text-secondary: #64748B; --text-muted: #94A3B8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--surface); color: var(--text-primary); overflow-x: hidden; height: 100vh; display: flex; flex-direction: column; }

    /* ── SIDEBAR ── */
    .sidebar { position: fixed; left: 0; top: 0; height: 100vh; width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; z-index: 100; transition: width .3s cubic-bezier(.4, 0, .2, 1); border-right: 1px solid rgba(255, 255, 255, .05); }
    .sidebar.collapsed { width: 68px; }
    .sidebar-logo { padding: 20px 20px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255, 255, 255, .06); min-height: 64px; }
    .logo-icon { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; background: linear-gradient(135deg, #0E9F6E, #3B5BDB); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #fff; }
    .logo-text { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; transition: opacity .2s; }
    .logo-sub { font-size: 10px; color: var(--sidebar-text); font-weight: 500; letter-spacing: .5px; text-transform: uppercase; }
    .sidebar.collapsed .logo-text, .sidebar.collapsed .logo-sub { opacity: 0; width: 0; }
    .sidebar-section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(148, 163, 184, .4); padding: 16px 20px 6px; white-space: nowrap; overflow: hidden; transition: opacity .2s; }
    .sidebar.collapsed .sidebar-section-label { opacity: 0; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 12px; overflow-x: hidden; }
    .sidebar-nav::-webkit-scrollbar { width: 3px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .1); border-radius: 10px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: all .2s; color: var(--sidebar-text); font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; margin-bottom: 2px; text-decoration: none; position: relative; }
    .nav-item:hover { background: rgba(255, 255, 255, .06); color: #fff; }
    .nav-item.active { background: linear-gradient(135deg, rgba(14, 159, 110, .25), rgba(59, 91, 219, .2)); color: #fff; box-shadow: inset 0 0 0 1px rgba(14, 159, 110, .35); }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; background: #0E9F6E; border-radius: 0 4px 4px 0; }
    .nav-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: .8; }
    .nav-item.active .nav-icon { opacity: 1; }
    .nav-label { transition: opacity .2s; }
    .sidebar.collapsed .nav-label { opacity: 0; width: 0; }
    .nav-badge { margin-left: auto; background: #F05252; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 20px; flex-shrink: 0; transition: opacity .2s; }
    .nav-badge.green { background: #0E9F6E; }
    .sidebar.collapsed .nav-badge { opacity: 0; }
    .sidebar-footer { padding: 12px; border-top: 1px solid rgba(255, 255, 255, .06); }
    .user-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: all .2s; overflow: hidden; }
    .user-card:hover { background: rgba(255, 255, 255, .06); }
    .user-avatar { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; background: linear-gradient(135deg, #0E9F6E, #3B5BDB); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; }
    .user-name { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; }
    .user-role-label { font-size: 11px; color: var(--sidebar-text); white-space: nowrap; }
    .sidebar.collapsed .user-info { opacity: 0; width: 0; }

    /* ── TOPBAR ── */
    .topbar { position: fixed; left: 260px; top: 0; right: 0; height: 64px; background: rgba(248, 250, 252, .92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 24px; gap: 16px; z-index: 90; transition: left .3s cubic-bezier(.4, 0, .2, 1); }
    .topbar.expanded { left: 68px; }
    .toggle-btn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0; }
    .toggle-btn:hover { background: var(--primary-light); border-color: var(--primary); }
    .breadcrumb { display: flex; align-items: center; gap: 6px; flex: 1; }
    .breadcrumb span { font-size: 13px; color: var(--text-secondary); }
    .breadcrumb .current { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .search-bar { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 0 14px; height: 38px; width: 260px; transition: all .2s; }
    .search-bar:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 91, 219, .1); }
    .search-bar input { border: none; outline: none; background: transparent; font-size: 13px; font-family: inherit; color: var(--text-primary); width: 100%; }
    .search-bar input::placeholder { color: var(--text-muted); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; position: relative; }
    .icon-btn:hover { background: var(--primary-light); border-color: var(--primary); }
    .notif-dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; background: #F05252; border-radius: 50%; border: 2px solid #fff; }
    .topbar-user { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 10px; cursor: pointer; transition: all .2s; border: 1px solid transparent; }
    .topbar-user:hover { background: #fff; border-color: var(--border); }
    .topbar-avatar { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #0E9F6E, #3B5BDB); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; }
    .topbar-uname { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .topbar-urole { font-size: 11px; color: var(--text-secondary); }

    /* ── MAIN (Full Height Map) ── */
    .main { margin-left: 260px; padding-top: 64px; height: 100vh; transition: margin-left .3s cubic-bezier(.4, 0, .2, 1); display: flex; flex-direction: column; overflow: hidden; }
    .main.expanded { margin-left: 68px; }
    
    .map-header { padding: 16px 24px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 10; font-family: 'Plus Jakarta Sans', sans-serif; position: relative; box-shadow: 0 4px 12px rgba(0,0,0,.03); }
    .map-filters { display: flex; gap: 10px; align-items: center; }
    .filter-select { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 12px; font-family: inherit; outline: none; appearance: none; background: #fff; cursor: pointer; min-width: 140px; box-shadow: 0 1px 2px rgba(0,0,0,.02); }
    .filter-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 91, 219, .1); }
    
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .2s; border: none; text-decoration: none; }
    .btn-outline { background: #fff; color: var(--text-primary); border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,.02); }
    .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 8px; }

    #map-container { flex: 1; width: 100%; position: relative; z-index: 1; }
    
    /* Custom Map Markers */
    .custom-map-marker { display: flex; flex-direction: column; align-items: center; transform: translateY(-50%); }
    .custom-map-marker-pin { width: 32px; height: 32px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; box-shadow: -2px 2px 6px rgba(0,0,0,.2); border: 2px solid #fff; position: relative; }
    .custom-map-marker-pin::after { content: ''; position: absolute; width: 12px; height: 12px; background: #fff; border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .custom-map-marker-label { margin-top: 4px; background: #fff; color: var(--text-primary); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; box-shadow: 0 2px 4px rgba(0,0,0,.15); white-space: nowrap; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; gap: 4px; }
    
    /* Specific Colors */
    .marker-rd .custom-map-marker-pin { background: #3B5BDB; }
    .marker-ak .custom-map-marker-pin { background: #0E9F6E; }
    .marker-sn .custom-map-marker-pin { background: #7C3AED; }

    .marker-dot-rd { width: 8px; height: 8px; background: #3B5BDB; border-radius: 50%; display: inline-block; }
    .marker-dot-ak { width: 8px; height: 8px; background: #0E9F6E; border-radius: 50%; display: inline-block; }
    .marker-dot-sn { width: 8px; height: 8px; background: #7C3AED; border-radius: 50%; display: inline-block; }

    /* Map Popup Styling */
    .leaflet-popup-content-wrapper { border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; padding: 0; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,.15); }
    .leaflet-popup-content { margin: 0; width: 260px !important; }
    .leaflet-popup-close-button { color: #fff !important; top: 8px !important; right: 8px !important; }
    
    .popup-header { color: #fff; padding: 14px 16px 12px; }
    .bg-rd { background: linear-gradient(135deg, #3B5BDB, #2F4AC7); }
    .bg-ak { background: linear-gradient(135deg, #0E9F6E, #057A55); }
    .bg-sn { background: linear-gradient(135deg, #7C3AED, #6D28D9); }

    .popup-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
    .popup-sub { font-size: 11px; opacity: 0.9; }
    
    .popup-body { padding: 14px 16px; background: #fff; }
    .popup-meta { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 12px; }
    .popup-meta-item { display: flex; flex-direction: column; }
    .popup-meta-label { color: var(--text-secondary); font-size: 10px; font-weight: 600; text-transform: uppercase; margin-bottom: 2px; }
    .popup-meta-val { font-weight: 700; color: var(--text-primary); }
    
    .popup-footer { padding: 12px 16px; background: #F8FAFC; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .popup-link { font-size: 12px; font-weight: 600; color: var(--primary); text-decoration: none; cursor: pointer; }
    .popup-link:hover { text-decoration: underline; }

    ::-webkit-scrollbar { width: 5px; height: 5px }
    ::-webkit-scrollbar-track { background: transparent }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px }
  </style>
</head>

  <script>
    // Sidebar toggle
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
      document.getElementById('topbar').classList.toggle('expanded');
      document.getElementById('main').classList.toggle('expanded');
      // Fix map rendering bug on resize
      setTimeout(() => { if (map) map.invalidateSize(); }, 300);
    }

    // Inisialisasi Peta - Fokus ke Surabaya
    var map = L.map('map-container').setView([-7.250445, 112.758845], 12);

    // Gunakan map tiles dari CartoDB (clean & professional)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    // Fungsi untuk membuat custom marker HTML icon
    function createCustomIcon(salesCode, labelText) {
      return L.divIcon({
