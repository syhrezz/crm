<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NexaCRM — Ganti Password</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="shared.css">
<style>
    /* Change Password Specific Styles */
    .section-title{font-size:18px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
    .section-desc{font-size:13px;color:var(--text-secondary);margin-bottom:32px;}
    
    .form-group{margin-bottom:20px;}
    .form-label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
    .input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:14px;font-family:inherit;outline:none;}
    .input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,91,219,.1);}
    
    .pwd-hint{margin-top:20px;padding:16px;background:var(--primary-light);border-radius:10px;}
    .pwd-hint h4{font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px;text-transform:uppercase;}
    .pwd-hint ul{list-style:none;padding:0;}
    .pwd-hint li{font-size:11px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;margin-bottom:4px;}
    .pwd-hint li::before{content:'✓';font-weight:800;color:var(--primary);}
</style>
</head>
<body>

  <div id="sidebar-container"></div>


  <div id="topbar-container"></div>


<!-- MAIN -->
<main class="main" id="main">
<div class="content">

  <div class="card">
    <h1 class="section-title">Perbarui Password</h1>
    <p class="section-desc">Gunakan password yang kuat untuk menjaga keamanan akun administrator Anda.</p>

    <form onsubmit="event.preventDefault(); alert('Password berhasil diubah!')">
      <div class="form-group">
        <label class="form-label">Password Saat Ini</label>
        <input type="password" class="input" placeholder="••••••••"/>
      </div>

      <div style="height:12px"></div>

      <div class="form-group">
        <label class="form-label">Password Baru</label>
        <input type="password" class="input" placeholder="Masukkan password baru"/>
      </div>

      <div class="form-group">
        <label class="form-label">Konfirmasi Password Baru</label>
        <input type="password" class="input" placeholder="Ulangi password baru"/>
      </div>

      <button type="submit" class="btn btn-primary" style="margin-top:12px">Simpan Password Baru</button>

      <div class="pwd-hint">
        <h4>Kriteria Keamanan</h4>
        <ul>
          <li>Minimal 8 karakter</li>
          <li>Mengandung huruf besar & kecil</li>
          <li>Mengandung angka atau simbol</li>
        </ul>
      </div>
    </form>
  </div>

</div>
</main>

  <script src="navigation.js"></script>

</body>
</html>
