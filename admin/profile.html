<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NexaCRM — Profil Saya</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{
  --primary:#3B5BDB;--primary-light:#EEF2FF;--primary-dark:#2F4AC7;
  --sidebar-bg:#0F172A;--sidebar-text:#94A3B8;
  --success:#0E9F6E;--warning:#E3A008;--danger:#F05252;
  --surface:#F8FAFC;--card:#FFFFFF;--border:#E2E8F0;
  --text-primary:#0F172A;--text-secondary:#64748B;--text-muted:#94A3B8;
  --admin-accent:#0F172A;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--surface);color:var(--text-primary);overflow-x:hidden;}

/* ── SIDEBAR ── */
.sidebar{position:fixed;left:0;top:0;height:100vh;width:268px;background:var(--sidebar-bg);display:flex;flex-direction:column;z-index:100;transition:width .3s cubic-bezier(.4,0,.2,1);border-right:1px solid rgba(255,255,255,.04);}
.sidebar.collapsed{width:68px;}
.sidebar-logo{padding:22px 20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.05);min-height:68px;}
.logo-icon{width:38px;height:38px;border-radius:11px;flex-shrink:0;background:linear-gradient(135deg,#1E293B,#334155);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.logo-text{font-size:17px;font-weight:800;color:#fff;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;transition:opacity .2s;}
.logo-sub{font-size:10px;color:var(--sidebar-text);font-weight:600;letter-spacing:1px;text-transform:uppercase;}
.sidebar.collapsed .logo-text,.sidebar.collapsed .logo-sub{opacity:0;width:0;}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 12px;overflow-x:hidden;}
.sidebar-nav::-webkit-scrollbar{width:3px;}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:10px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .2s;color:var(--sidebar-text);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;margin-bottom:2px;position:relative;text-decoration:none;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:#38BDF8;border-radius:0 4px 4px 0;}
.nav-icon{width:20px;height:20px;flex-shrink:0;opacity:.8;}
.nav-item.active .nav-icon{opacity:1;color:#38BDF8;}

/* ── TOPBAR ── */
.topbar{position:fixed;left:268px;top:0;right:0;height:68px;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;z-index:90;transition:left .3s cubic-bezier(.4,0,.2,1);}
.topbar.expanded{left:68px;}
.toggle-btn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.toggle-btn:hover{background:var(--primary-light);border-color:var(--primary);}
.breadcrumb{display:flex;align-items:center;gap:6px;flex:1;}
.breadcrumb span{font-size:13px;color:var(--text-secondary);}
.breadcrumb .current{font-size:13px;font-weight:700;color:var(--text-primary);}

/* ── MAIN ── */
.main{margin-left:268px;padding-top:68px;min-height:100vh;transition:margin-left .3s cubic-bezier(.4,0,.2,1);}
.main.expanded{margin-left:68px;}
.content{padding:28px;}

/* ── PROFILE ── */
.card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.04);max-width:800px;margin:0 auto;}
.profile-header{display:flex;align-items:center;gap:32px;margin-bottom:40px;padding-bottom:10px;}
.profile-avatar{width:120px;height:120px;border-radius:30px;background:#1E293B;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#fff;box-shadow:0 10px 20px rgba(0,0,0,.15);position:relative;}
.avatar-edit{position:absolute;bottom:-8px;right:-8px;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.1);}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.form-group{margin-bottom:20px;}
.form-label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px;}
.input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:13px;font-family:inherit;outline:none;}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,91,219,.1);}

.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;border:none;text-decoration:none;font-family:inherit;}
.btn-primary{background:var(--admin-accent);color:#fff;}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text-primary);}

</style>
</head>
<body>

<!-- SIDEBAR (Standard Admin) -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">N</div>
    <div>
      <div class="logo-text">NexaCRM</div>
      <div class="logo-sub">Administrator</div>
    </div>
  </div>
  <div class="sidebar-nav">
    <div class="sidebar-section-label">Main</div>
    <a href="index.html" class="nav-item">
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span class="nav-label">Dashboard</span>
    </a>
    <a href="users.html" class="nav-item">
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      <span class="nav-label">Manajemen Pengguna</span>
    </a>
    <a href="master-data.html" class="nav-item">
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
      <span class="nav-label">Master Data</span>
    </a>
    <a href="audit-log.html" class="nav-item">
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="nav-label">Audit Log</span>
    </a>
    <div class="sidebar-section-label" style="margin-top:16px">Config</div>
    <a href="settings/general.html" class="nav-item">
      <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924-1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg>
      <span class="nav-label">Settings</span>
    </a>
  </div>
</nav>

<!-- TOPBAR -->
<header class="topbar" id="topbar">
  <button class="toggle-btn" onclick="toggleSidebar()">
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#64748B"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="breadcrumb">
    <span>Administrator</span>
    <span style="color:var(--text-muted);font-size:12px">›</span>
    <span class="current">Profil Saya</span>
  </div>
</header>

<!-- MAIN -->
<main class="main" id="main">
<div class="content">

  <div class="card">
    <div class="profile-header">
      <div class="profile-avatar">
        AD
        <div class="avatar-edit" onclick="alert('Buka uploader foto...')">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#64748B" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>
        </div>
      </div>
      <div>
        <h1 style="font-size:24px;font-weight:800;letter-spacing:-.8px">System Administrator</h1>
        <p style="font-size:14px;color:var(--text-secondary);margin-top:4px">Level Akses: <strong>Root Owner</strong></p>
        <div style="margin-top:12px; display:flex; gap:8px">
          <span class="btn btn-outline btn-sm" style="font-size:11px; padding:4px 8px; border-radius:6px; background:#F1F5F9">ID: ADMIN-001</span>
          <span class="btn btn-outline btn-sm" style="font-size:11px; padding:4px 8px; border-radius:6px; background:#F1F5F9">Verified Account</span>
        </div>
      </div>
    </div>

    <form onsubmit="event.preventDefault(); alert('Profil berhasil diperbarui!')">
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Nama Lengkap*</label>
          <input type="text" class="input" value="System Administrator"/>
        </div>
        <div class="form-group">
          <label class="form-label">Alamat Email*</label>
          <input type="email" class="input" value="admin@nexacrm.com"/>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Nomor WhatsApp*</label>
          <input type="text" class="input" value="081234567890"/>
        </div>
        <div class="form-group">
          <label class="form-label">Departemen</label>
          <input type="text" class="input" value="IT & Infrastructure" disabled/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Bio Singkat</label>
        <textarea class="input" style="height:80px;resize:none" placeholder="Tuliskan sesuatu tentang peran Anda..."></textarea>
      </div>

      <div style="margin-top:32px; padding-top:24px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center">
        <a href="change-password.html" style="font-size:13px; font-weight:700; color:var(--primary); text-decoration:none">Ganti Password?</a>
        <button type="submit" class="btn btn-primary">Simpan Profil</button>
      </div>
    </form>
  </div>

</div>
</main>

<script>
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
  document.getElementById('topbar').classList.toggle('expanded');
}
</script>
</body>
</html>
