<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NexaCRM — Sektor Industri</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../shared.css">
  <style>
    /* Industry Specific Styles */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
    .modal{background:#fff;width:100%;max-width:400px;border-radius:16px;overflow:hidden;animation:modalIn .3s ease;}
    @keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
    .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .modal-body{padding:24px;}
    .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px;}

    .form-group{margin-bottom:16px;}
    .form-label{display:block;font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
    .input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:13px;font-family:inherit;outline:none;}
    .input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,91,219,.1);}
  </style>

</style>
</head>
<body>

  <div id="sidebar-container"></div>


  <div id="topbar-container"></div>


<!-- MAIN -->
<main class="main" id="main">
<div class="content">

  <div class="card" style="padding:0; overflow:hidden">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama Industri</th>
            <th>Status</th>
            <th style="width:100px">Aksi</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="font-family:'JetBrains Mono';font-size:12px">IND-001</td>
            <td style="font-weight:700">Manufaktur</td>
            <td><span class="badge bg-success">Aktif</span></td>
            <td><button class="btn btn-outline btn-sm" onclick="alert('Edit industri...')">Edit</button></td>
          </tr>
          <tr>
            <td style="font-family:'JetBrains Mono';font-size:12px">IND-002</td>
            <td style="font-weight:700">Kesehatan (Healthcare)</td>
            <td><span class="badge bg-success">Aktif</span></td>
            <td><button class="btn btn-outline btn-sm">Edit</button></td>
          </tr>
          <tr>
            <td style="font-family:'JetBrains Mono';font-size:12px">IND-003</td>
            <td style="font-weight:700">Teknologi Informasi</td>
            <td><span class="badge bg-success">Aktif</span></td>
            <td><button class="btn btn-outline btn-sm">Edit</button></td>
          </tr>
          <tr>
            <td style="font-family:'JetBrains Mono';font-size:12px">IND-004</td>
            <td style="font-weight:700">Retail / E-commerce</td>
            <td><span class="badge bg-success">Aktif</span></td>
            <td><button class="btn btn-outline btn-sm">Edit</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
</main>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 style="font-size:16px;font-weight:800">Sektor Industri Baru</h2>
      <button onclick="hideModal()" style="border:none;background:none;cursor:pointer;font-size:20px;color:var(--text-muted)">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Nama Industri*</label>
        <input type="text" class="input" placeholder="Masukkan nama industri..."/>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="hideModal()">Batal</button>
      <button class="btn btn-primary" onclick="alert('Sektor industri berhasil disimpan!'); hideModal()">Simpan</button>
    </div>
  </div>
</div>

  <script src="../navigation.js"></script>
  <script>
    const modal = document.getElementById('modal');
    function showModal() { modal.style.display = 'flex'; }
    function hideModal() { modal.style.display = 'none'; }

    // Breadcrumb Override
    window.addEventListener('load', () => {
      const breadcrumb = document.getElementById('breadcrumb-container');
      if (breadcrumb) {
        breadcrumb.innerHTML = `
          <a href="../master-data.html" style="text-decoration:none; color:var(--text-secondary)">Pusat Data Master</a>
          <span style="color:var(--text-muted);font-size:12px;margin:0 4px">›</span>
          <span class="current" style="font-weight:700">Sektor Industri</span>
        `;
      }
      
      // Add action button to topbar
      const actions = document.querySelector('.topbar-actions');
      if (actions) {
        const btn = document.createElement('button');
        btn.className = 'btn btn-primary btn-sm';
        btn.innerHTML = '<svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3" style="margin-right:6px"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg> Tambah Sektor';
        btn.onclick = showModal;
        actions.prepend(btn);
      }
    });
  </script>

</body>
</html>
