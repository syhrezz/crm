<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexaCRM — Ubah Kata Sandi</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #3B5BDB;
            --primary-light: #EEF2FF;
            --primary-dark: #2F4AC7;
            --sidebar-bg: #0F172A;
            --sidebar-text: #94A3B8;
            --success: #0E9F6E;
            --warning: #E3A008;
            --danger: #F05252;
            --surface: #F8FAFC;
            --card: #FFFFFF;
            --border: #E2E8F0;
            --text-primary: #0F172A;
            --text-secondary: #64748B;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--surface);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* SIDEBAR (Identical Base) */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 260px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: width .3s cubic-bezier(.4, 0, .2, 1);
            border-right: 1px solid rgba(255, 255, 255, .05);
        }

        .sidebar.collapsed {
            width: 68px;
        }

        .sidebar-logo {
            padding: 20px 20px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
            min-height: 64px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #3B5BDB, #7C3AED);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            color: #fff;
        }

        .logo-text {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -.5px;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity .2s;
        }

        .logo-sub {
            font-size: 10px;
            color: var(--sidebar-text);
            font-weight: 500;
            letter-spacing: .5px;
            text-transform: uppercase;
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .sidebar-nav::-webkit-scrollbar {
            width: 3px;
        }

        .sidebar-nav::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .1);
            border-radius: 10px;
        }

        .sidebar-section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(148, 163, 184, .4);
            padding: 16px 20px 6px;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity .2s;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all .2s;
            color: var(--sidebar-text);
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            margin-bottom: 2px;
            text-decoration: none;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, .06);
            color: #fff;
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(59, 91, 219, .3), rgba(124, 58, 237, .2));
            color: #fff;
            box-shadow: inset 0 0 0 1px rgba(59, 91, 219, .4);
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 60%;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            opacity: .8;
        }

        .nav-item.active .nav-icon {
            opacity: 1;
        }

        .nav-badge {
            margin-left: auto;
            background: #F05252;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 20px;
            flex-shrink: 0;
            transition: opacity .2s;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid rgba(255, 255, 255, .06);
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all .2s;
            overflow: hidden;
            text-decoration: none;
        }

        .user-card:hover {
            background: rgba(255, 255, 255, .06);
        }

        .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #3B5BDB, #7C3AED);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .user-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
        }

        .user-role {
            font-size: 11px;
            color: var(--sidebar-text);
            white-space: nowrap;
        }

        .sidebar.collapsed .sidebar-section-label,
        .sidebar.collapsed .logo-text,
        .sidebar.collapsed .logo-sub,
        .sidebar.collapsed .nav-label,
        .sidebar.collapsed .nav-badge,
        .sidebar.collapsed .user-info {
            opacity: 0;
            width: 0;
        }

        /* TOPBAR (Identical Base) */
        .topbar {
            position: fixed;
            left: 260px;
            top: 0;
            right: 0;
            height: 64px;
            background: rgba(248, 250, 252, .92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
            z-index: 90;
            transition: left .3s cubic-bezier(.4, 0, .2, 1);
        }

        .topbar.expanded {
            left: 68px;
        }

        .toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            flex-shrink: 0;
        }

        .toggle-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }

        .breadcrumb span,
        .breadcrumb a {
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .breadcrumb a:hover {
            color: var(--primary);
        }

        .breadcrumb .current {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
            height: 38px;
            width: 260px;
            transition: all .2s;
        }

        .search-bar:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 91, 219, .1);
        }

        .search-bar input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-primary);
            width: 100%;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .2s;
            position: relative;
            text-decoration: none;
        }

        .icon-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }

        .notif-dot {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 8px;
            height: 8px;
            background: #F05252;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .topbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all .2s;
            border: 1px solid transparent;
        }

        .topbar-user:hover {
            background: #fff;
            border-color: var(--border);
        }

        .topbar-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #3B5BDB, #7C3AED);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
        }

        .topbar-uname {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .topbar-urole {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* MAIN */
        .main {
            margin-left: 260px;
            padding-top: 64px;
            min-height: 100vh;
            transition: margin-left .3s cubic-bezier(.4, 0, .2, 1);
        }

        .main.expanded {
            margin-left: 68px;
        }

        .content {
            padding: 40px;
        }

        /* CARDS */
        .card {
            background: var(--card);
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .card-shadow {
            box-shadow: 0 1px 3px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .04);
        }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all .2s;
            border: none;
            text-decoration: none;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 1px 3px rgba(59, 91, 219, .3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(59, 91, 219, .35);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: #fff;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: none;
        }

        .btn-ghost:hover {
            background: var(--surface);
            color: var(--text-primary);
        }

        /* FORM */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 9px;
            border: 1px solid var(--border);
            font-size: 13px;
            font-family: inherit;
            color: var(--text-primary);
            transition: all .2s;
            outline: none;
            background: #fff;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 91, 219, .1);
        }

        .eye-toggle {
            position: absolute;
            right: 14px;
            top: 38px;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .eye-toggle:hover {
            color: var(--text-primary);
        }

        /* PASSWORD STRENGTH */
        .strength-meter {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        .strength-bar {
            height: 4px;
            flex: 1;
            border-radius: 4px;
            background: var(--border);
            transition: all 0.3s ease;
        }

        /* DATA PROGRESS */
        .strength-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        /* ANIMATIONS */
        .fade-up {
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp .4s ease forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .d1 {
            animation-delay: .05s
        }
    </style>
</head>

<body>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">N</div>
            <div>
                <div class="logo-text">NexaCRM</div>
                <div class="logo-sub">Edisi Sales</div>
            </div>
        </div>
        <div class="sidebar-nav">
            <div class="sidebar-section-label">Menu Utama</div>
            <a href="index.html" class="nav-item">
                <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                <span class="nav-label">Beranda</span>
            </a>
            <a href="prospect.html" class="nav-item">
                <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>

            <a href="activities.html" class="nav-item">

                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span class="nav-label">Aktivitas</span>
            </a>
            <a href="products.html" class="nav-item">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                </svg>
                <span class="nav-label">Produk</span>
            </a>
            <div class="sidebar-section-label" style="margin-top:8px">Lainnya</div>
            <a href="help.html" class="nav-item">
                <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="nav-label">Bantuan</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <a href="profile.html" class="user-card" style="display: flex;">
                <div class="user-avatar">RD</div>
                <div class="user-info">
                    <div class="user-name">Rizky Dwi</div>
                    <div class="user-role">Sales · Surabaya</div>
                </div>
            </a>
        </div>
    </nav>

    <header class="topbar" id="topbar">
        <button class="toggle-btn" onclick="toggleSidebar()">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#64748B">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <div class="breadcrumb">
            <span>Akun</span>
            <span style="color:var(--text-muted);font-size:12px">›</span>
            <a href="profile.html">Profil Saya</a>
            <span style="color:var(--text-muted);font-size:12px">›</span>
            <span class="current">Ubah Kata Sandi</span>
        </div>
        <div class="topbar-actions" style="margin-left: auto;">
            <a href="notifications.html" class="icon-btn" data-tip="Notifikasi">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#64748B">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                </svg>
                <div class="notif-dot"></div>
            </a>
            <button class="icon-btn" data-tip="Tambah prospek" onclick="window.location.href='prospect.html'">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#64748B">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
            <div class="topbar-user">
                <div class="topbar-avatar">RD</div>
                <div>
                    <div class="topbar-uname">Rizky Dwi</div>
                    <div class="topbar-urole">Sales Rep</div>
                </div>
                <svg width="12" height="12" fill="none" viewBox="0 0 24 24" stroke="#94A3B8" style="margin-left:4px">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </div>
        </div>
    </header>

    <main class="main" id="main">
        <div class="content">

            <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px" class="fade-up">
                <a href="profile.html" class="icon-btn" style="border-radius: 12px; width: 42px; height: 42px;">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <div>
                    <h1 style="font-size:24px;font-weight:800;letter-spacing:-.5px; color:var(--text-primary)">Perbarui
                        Kata Sandi</h1>
                    <p style="font-size:13px;color:var(--text-secondary);margin-top:2px">Jaga keamanan akun Anda dengan
                        menggunakan kata sandi yang kuat.</p>
                </div>
            </div>

            <div class="card card-shadow fade-up d1" style="max-width: 520px; margin: 0 auto; padding: 40px;">

                <div style="text-align: center; margin-bottom: 32px;">
                    <div
                        style="width: 64px; height: 64px; border-radius: 16px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 4px 12px rgba(59, 91, 219, 0.1);">
                        <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>
                </div>

                <form
                    onsubmit="event.preventDefault(); alert('Kata sandi berhasil diperbarui!'); location.href='profile.html';">
                    <div class="form-group">
                        <label class="form-label">Kata Sandi Saat Ini</label>
                        <input type="password" id="currentPass" class="form-input"
                            placeholder="Masukkan kata sandi saat ini" required />
                        <svg class="eye-toggle" onclick="togglePassword('currentPass')" width="18" height="18"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </div>

                    <div style="height:1px; background:var(--border); margin: 24px 0;"></div>

                    <div class="form-group">
                        <label class="form-label">Kata Sandi Baru</label>
                        <input type="password" id="newPass" class="form-input" placeholder="Minimal 8 karakter" required
                            onkeyup="checkStrength(this.value)" />
                        <svg class="eye-toggle" onclick="togglePassword('newPass')" width="18" height="18" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>

                        <div class="strength-meter">
                            <div class="strength-bar" id="bar1"></div>
                            <div class="strength-bar" id="bar2"></div>
                            <div class="strength-bar" id="bar3"></div>
                        </div>
                        <div class="strength-text" id="strengthText">Kekuatan Kata Sandi</div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Konfirmasi Kata Sandi Baru</label>
                        <input type="password" id="confirmPass" class="form-input"
                            placeholder="Ketik ulang kata sandi baru" required />
                        <svg class="eye-toggle" onclick="togglePassword('confirmPass')" width="18" height="18"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.522 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </div>

                    <div style="margin-top: 32px">
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Perbarui Kata Sandi</button>
                    </div>
                </form>
            </div>

        </div>
    </main>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
            document.getElementById('topbar').classList.toggle('expanded');
            document.getElementById('main').classList.toggle('expanded');
        }

        function togglePassword(id) {
            const input = document.getElementById(id);
            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

        function checkStrength(value) {
            const bar1 = document.getElementById('bar1');
            const bar2 = document.getElementById('bar2');
            const bar3 = document.getElementById('bar3');
            const strText = document.getElementById('strengthText');

            // reset
            bar1.style.background = 'var(--border)';
            bar2.style.background = 'var(--border)';
            bar3.style.background = 'var(--border)';
            strText.style.color = 'var(--text-secondary)';
            strText.innerText = 'Kekuatan Kata Sandi';

            if (value.length === 0) return;

            let strength = 0;
            if (value.length >= 8) strength += 1;
            if (value.match(/[A-Z]/) && value.match(/[0-9]/)) strength += 1;
            if (value.match(/[^A-Za-z0-9]/)) strength += 1;

            if (strength === 1 || (value.length > 0 && strength === 0)) {
                bar1.style.background = 'var(--danger)';
                strText.style.color = 'var(--danger)';
                strText.innerText = 'Lemah';
            } else if (strength === 2) {
                bar1.style.background = 'var(--warning)';
                bar2.style.background = 'var(--warning)';
                strText.style.color = 'var(--warning)';
                strText.innerText = 'Sedang';
            } else if (strength === 3) {
                bar1.style.background = 'var(--success)';
                bar2.style.background = 'var(--success)';
                bar3.style.background = 'var(--success)';
                strText.style.color = 'var(--success)';
                strText.innerText = 'Kuat';
            }
        }
    </script>
</body>

</html>
