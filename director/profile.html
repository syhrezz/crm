<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexaCRM — Profil Direktur</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #3B5BDB; --primary-light: #EEF2FF; --primary-dark: #2F4AC7;
      --sidebar-bg: #0C0F1A; --sidebar-text: #94A3B8;
      --success: #0E9F6E; --warning: #E3A008; --danger: #F05252;
      --surface: #F0F4FF; --card: #FFFFFF; --border: #E2E8F0;
      --text-primary: #0F172A; --text-secondary: #64748B; --text-muted: #94A3B8;
      --dir-accent: #6366F1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--surface); color: var(--text-primary); overflow-x: hidden; }

    /* ── SIDEBAR ── */
    .sidebar { position: fixed; left: 0; top: 0; height: 100vh; width: 268px; background: var(--sidebar-bg); display: flex; flex-direction: column; z-index: 100; transition: width .3s cubic-bezier(.4, 0, .2, 1); border-right: 1px solid rgba(255, 255, 255, .04); }
    .sidebar.collapsed { width: 68px; }
    .sidebar-logo { padding: 22px 20px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255, 255, 255, .05); min-height: 68px; }
    .logo-icon { width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0; background: linear-gradient(135deg, #6366F1, #8B5CF6); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,.4); }
    .logo-text { font-size: 17px; font-weight: 800; color: #fff; letter-spacing: -.5px; white-space: nowrap; overflow: hidden; transition: opacity .2s; }
    .logo-sub { font-size: 10px; color: var(--sidebar-text); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .sidebar.collapsed .logo-text, .sidebar.collapsed .logo-sub { opacity: 0; width: 0; }
    .sidebar-section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(148, 163, 184, .35); padding: 16px 20px 6px; white-space: nowrap; overflow: hidden; transition: opacity .2s; }
    .sidebar.collapsed .sidebar-section-label { opacity: 0; }
    .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 12px; overflow-x: hidden; }
    .sidebar-nav::-webkit-scrollbar { width: 3px; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .08); border-radius: 10px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: all .2s; color: var(--sidebar-text); font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; margin-bottom: 2px; position: relative; text-decoration: none; }
    .nav-item:hover { background: rgba(255, 255, 255, .06); color: #fff; }
    .nav-item.active { background: linear-gradient(135deg, rgba(99,102,241,.28), rgba(139,92,246,.18)); color: #fff; box-shadow: inset 0 0 0 1px rgba(99,102,241,.4); }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; background: #6366F1; border-radius: 0 4px 4px 0; }
    .nav-icon { width: 20px; height: 20px; flex-shrink: 0; opacity: .8; }
    .nav-item.active .nav-icon { opacity: 1; }
    .nav-label { transition: opacity .2s; }
    .sidebar.collapsed .nav-label { opacity: 0; width: 0; }

    /* ── TOPBAR ── */
    .topbar { position: fixed; left: 268px; top: 0; right: 0; height: 68px; background: rgba(240, 244, 255, .92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 28px; gap: 16px; z-index: 90; transition: left .3s cubic-bezier(.4, 0, .2, 1); }
    .topbar.expanded { left: 68px; }
    .toggle-btn { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border); background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0; }
    .toggle-btn:hover { background: var(--primary-light); border-color: var(--primary); }
    .breadcrumb { display: flex; align-items: center; gap: 6px; flex: 1; }
    .breadcrumb span { font-size: 13px; color: var(--text-secondary); }
    .breadcrumb .current { font-size: 13px; font-weight: 700; color: var(--text-primary); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .topbar-user { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 10px; cursor: pointer; transition: all .2s; border: 1px solid transparent; }
    .topbar-user:hover { background: #fff; border-color: var(--border); }
    .topbar-avatar { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, #6366F1, #8B5CF6); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; }
    .topbar-uname { font-size: 13px; font-weight: 600; color: var(--text-primary); }

    /* ── MAIN ── */
    .main { margin-left: 268px; padding-top: 68px; min-height: 100vh; transition: margin-left .3s cubic-bezier(.4, 0, .2, 1); }
    .main.expanded { margin-left: 68px; }
    .content { padding: 28px; max-width: 800px; margin: 0 auto; }

    /* PROFILE */
    .card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .profile-hero { padding: 32px 28px; border-bottom: 1px solid var(--border); display: flex; gap: 24px; align-items: center; background: linear-gradient(to bottom, #F8FAFC, #FFFFFF); }
    .profile-avatar-large { width: 96px; height: 96px; border-radius: 20px; background: linear-gradient(135deg, #6366F1, #8B5CF6); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; color: #fff; box-shadow: 0 10px 25px rgba(99,102,241,.3); flex-shrink: 0; position: relative; }
    .profile-avatar-edit { position: absolute; bottom: -8px; right: -8px; width: 32px; height: 32px; border-radius: 10px; background: #fff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); box-shadow: 0 2px 5px rgba(0,0,0,.1); transition: all .2s; }
    .profile-avatar-edit:hover { color: var(--dir-accent); border-color: var(--dir-accent); }
    
    .profile-info-main h2 { font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -.5px; }
    .profile-info-main p { font-size: 14px; color: var(--text-secondary); }
    
    .role-badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-top: 8px; background: #F3E8FF; color: #9333EA; border: 1px solid #D8B4FE; }

    .form-section { padding: 28px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .form-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: #F8FAFC; transition: all .2s; outline: none; }
    .form-input:focus { background: #fff; border-color: var(--dir-accent); box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
    
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 10px 20px; border-radius: 10px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .2s; border: none; text-decoration: none; }
    .btn-primary { background: var(--dir-accent); color: #fff; box-shadow: 0 1px 3px rgba(99,102,241,.3); }
    .btn-primary:hover { background: #4F46E5; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.3); }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">N</div>
      <div>
        <div class="logo-text">NexaCRM</div>
        <div class="logo-sub">Edisi Direktur</div>

    </div>
    <div class="sidebar-nav">
      <div class="sidebar-section-label">Menu Utama</div>
      <a href="index.html" class="nav-item">
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span class="nav-label">Executive Dashboard</span>
      </a>
      <a href="reports.html" class="nav-item">

        <span class="nav-label">Laporan</span>
      </a>
      <a href="users.html" class="nav-item">
        <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        <span class="nav-label">Manajemen Pengguna</span>
      </a>
      <!-- ... -->

      <a href="profile.html" class="nav-item active">

        <span class="nav-label">Profil Saya</span>

      <a href="change-password.html" class="nav-item">

        <span class="nav-label">Ganti Password</span>
      </a>
    </div>
  </nav>

  <!-- TOPBAR -->
  <header class="topbar" id="topbar">
    <button class="toggle-btn" onclick="toggleSidebar()">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#64748B"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>

    <div class="breadcrumb">
      <span>Akun</span>
      <span style="color:var(--text-muted);font-size:12px">›</span>

              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>

        <div class="form-section">

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">

          <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
            <button class="btn btn-primary" onclick="alert('Profil berhasil diperbarui!')">Simpan Perubahan</button>

        </div>
      </div>

    </div>
  </main>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
      document.getElementById('topbar').classList.toggle('expanded');
      document.getElementById('main').classList.toggle('expanded');
    }
  </script>
</body>
</html>
