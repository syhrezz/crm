<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexaCRM — Profil Direktur</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    /* ── PAGE SPECIFIC STYLES ── */
    .content { padding: 28px; max-width: 800px; margin: 0 auto; }

    /* PROFILE */
    .card { background: var(--card); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .profile-hero { padding: 32px 28px; border-bottom: 1px solid var(--border); display: flex; gap: 24px; align-items: center; background: linear-gradient(to bottom, #F8FAFC, #FFFFFF); }
    .profile-avatar-large { width: 96px; height: 96px; border-radius: 20px; background: linear-gradient(135deg, #6366F1, #8B5CF6); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; color: #fff; box-shadow: 0 10px 25px rgba(99,102,241,.3); flex-shrink: 0; position: relative; }
    .profile-avatar-edit { position: absolute; bottom: -8px; right: -8px; width: 32px; height: 32px; border-radius: 10px; background: #fff; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-secondary); box-shadow: 0 2px 5px rgba(0,0,0,.1); transition: all .2s; }
    .profile-avatar-edit:hover { color: var(--dir-accent); border-color: var(--dir-accent); }
    
    .profile-info-main h2 { font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; letter-spacing: -.5px; }
    .profile-info-main p { font-size: 14px; color: var(--text-secondary); }
    
    .role-badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-top: 8px; background: #F3E8FF; color: #9333EA; border: 1px solid #D8B4FE; }

    .form-section { padding: 28px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .form-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; background: #F8FAFC; transition: all .2s; outline: none; }
    .form-input:focus { background: #fff; border-color: var(--dir-accent); box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
  </style>

</head>
<body>

  <div id="sidebar-container"></div>


  <div id="topbar-container"></div>


  <!-- MAIN -->
  <main class="main" id="main">
    <div class="content">

      <div class="card">
        <div class="profile-hero">
          <div class="profile-avatar-large">
            HS
            <div class="profile-avatar-edit" title="Ganti Foto Profil">
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
          </div>
          <div class="profile-info-main">
            <h2>Hendra Saputra</h2>
            <p>hendra.s@nexacrm.com</p>
            <span class="role-badge">Direktur / Executive</span>
          </div>
        </div>
        
        <div class="form-section">
          <h3 style="font-size:16px;font-weight:700;margin-bottom:20px;color:var(--text-primary)">Informasi Personal</h3>
          
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
            <div class="form-group">
              <label class="form-label">Nama Lengkap</label>
              <input type="text" class="form-input" value="Hendra Saputra" />
            </div>
            <div class="form-group">
              <label class="form-label">Email Induk (Sistem)</label>
              <input type="email" class="form-input" value="hendra.s@nexacrm.com" disabled style="opacity:0.6;cursor:not-allowed" />
            </div>
            <div class="form-group">
              <label class="form-label">Nomor Handphone / WhatsApp</label>
              <input type="text" class="form-input" value="+62 811 2233 4455" />
            </div>
            <div class="form-group">
              <label class="form-label">Hak Akses Sistem</label>
              <input type="text" class="form-input" value="Semua Modul Terbuka" disabled style="opacity:0.6;cursor:not-allowed;background:#F3E8FF" />
            </div>
          </div>

          <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border)">
            <button class="btn btn-primary" onclick="alert('Profil berhasil diperbarui!')">Simpan Perubahan</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="navigation.js"></script>
</body>
</html>
